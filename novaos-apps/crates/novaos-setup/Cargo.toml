[package]
name = "novaos-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "NovaOS setup app (GTK4 + libadwaita)"

[[bin]]
name = "novaos-setup"
path = "src/main.rs"

[dependencies]
novaos-common = { path = "../novaos-common" }
# Stesse versioni di nova-ai-ui (gtk4 0.9 / libadwaita 0.7 su glib 0.20):
# versioni diverse di glib spezzano il type-check (tipi IsA diversi).
gtk4 = { version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
async-channel = "2"
